name: Dead-man's switch

# Runs on its OWN daily schedule, deliberately independent of titan-pulse.yml
# — if the pulse's own cron has been silently paused or every recent run has
# crashed before writing state, this is what notices and says so loudly,
# rather than the pulse being the only thing that could ever report its own
# failure.
on:
  schedule:
    - cron: "0 13 * * *" # once a day
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # open the alert issue
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Check heartbeat freshness
        id: check
        run: node scripts/check-heartbeat.mjs || echo "TRIPPED=1" >> "$GITHUB_ENV"

      # RT3: the alert Issue is opened by a script that uses the gated GitHub client. No third-party action.
      - name: Open an alert issue
        if: env.TRIPPED == '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          detail="$(node scripts/check-heartbeat.mjs 2>&1 || true)"
          node scripts/alert-issue.mjs open --label titan-alert --title "TITAN-Runner: no successful pulse in 24h" \
            --body "The dead-man's switch tripped. No pulse has succeeded in the last 24 hours. Detail: ${detail} Check the Actions tab for the TITAN Pulse run history. Common causes: GitHub paused the schedule after 60 days with no commits, a bug in a recent change to src/pulse.js, or every provider key expired at once."

      - name: Fail the job so this is visible in the Actions tab too
        if: env.TRIPPED == '1'
        run: exit 1
