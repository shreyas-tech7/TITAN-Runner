name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - run: npm ci --no-audit --no-fund

      - name: Unit tests (dry-run, zero network/credentials required)
        run: npm test

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Coverage gate (no drop from baseline)
        run: node scripts/check-coverage.mjs

      - name: Secret scan of state/
        run: node scripts/check-secrets-in-state.mjs

      - name: State contract verification (schema, redaction gate, size budget)
        run: node scripts/verify-state.mjs

      - name: Dry-run pulse against fixtures (zero network calls)
        run: npm run pulse:dry

      # Every self-authored pull request (and every other one) runs the
      # full test suite above, plus this denylist gate — a PR that touches
      # .github/workflows/, the reviewer gate, the secret-handling code, or
      # the denylist itself fails CI outright, whether or not it came from
      # the self-improve flow (see src/denylist.js, src/selfImprove.js).
      #
      # BASE_REF is passed through `env:` rather than interpolated straight
      # into the `run:` shell line — task brief, Track A #2: never splice a
      # GitHub Actions expression directly into a shell command, even one
      # (like a PR's own base branch name) that is not realistically
      # attacker-controlled, so every workflow in this repo follows the same
      # rule uniformly rather than reasoning about which fields are "safe
      # enough" case by case.
      - name: Denylist gate (pull requests only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node scripts/check-denylist.mjs "origin/$BASE_REF" "HEAD"

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Downloaded directly rather than via a third-party Action, so there is
      # one fewer SHA-pinned external Action to trust for a single-binary CLI
      # tool — pinned to an exact release and checksum-verified instead.
      - name: Install actionlint v1.7.12 (checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSLo actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -version

      - name: actionlint
        run: ./actionlint -color

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
