name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - run: npm ci --no-audit --no-fund

      - name: Unit tests (dry-run, zero network/credentials required)
        run: npm test

      - name: Dashboard typecheck and tests
        working-directory: dashboard
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm test

      - name: Secret scan of state/
        run: node scripts/check-secrets-in-state.mjs

      - name: Static workflow checks (SHA pins, no untrusted text in run:, permissions)
        run: node scripts/check-workflows.mjs

      - name: Data contract (schemas/ in sync with src/state/schema.js)
        run: node scripts/export-schemas.mjs --check

      # Every self-authored pull request (and every other one) runs the
      # full test suite above, plus this denylist gate. A PR opened by the
      # self-improve flow (head ref self-improve/*, or authored by the
      # Actions bot) that touches .github/, the reviewer gate, the
      # secret-handling code, or the denylist itself fails CI outright;
      # a human-authored PR touching the same paths gets a warning
      # annotation and a maintainer reviews it by hand (see
      # scripts/check-denylist.mjs and docs/runner-upgrade/DECISIONS.md D-5).
      # Event fields reach the script through env, never a shell line.
      - name: Denylist gate (pull requests only)
        if: github.event_name == 'pull_request'
        env:
          TITAN_BASE_REF: origin/${{ github.event.pull_request.base.ref }}
          TITAN_HEAD_REF: HEAD
          TITAN_PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          TITAN_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node scripts/check-denylist.mjs "$TITAN_BASE_REF" "$TITAN_HEAD_REF"

      - name: Secret scan of the pull request diff
        if: github.event_name == 'pull_request'
        env:
          TITAN_BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: node scripts/check-secrets-in-diff.mjs "$TITAN_BASE_REF" HEAD
