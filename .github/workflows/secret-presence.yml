name: Key secret presence

# Prints "present" or "missing" for each provider key secret. It never prints a value.
# A secret reaches the step only through env:. Each value goes to a shell function as an
# argument, and the function prints only the name and the word. Nothing here runs set -x,
# env, printenv, or cat. The names are listed in docs/CONTRACT.md (additive notes, version 1).
on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/workflows/secret-presence.yml"

# A skill that runs in Actions gets T0 and T1 only.
env:
  TITAN_COMPUTER_MAX_TIER: "1"

permissions:
  contents: read

jobs:
  presence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report which key secrets are set
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          FREEBUFF_API_KEY: ${{ secrets.FREEBUFF_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          CUSTOM_1_API_KEY: ${{ secrets.CUSTOM_1_API_KEY }}
        run: |
          set -eu
          report() {
            if [ -n "$2" ]; then
              echo "$1: present"
            else
              echo "$1: missing"
            fi
          }
          report GROQ_API_KEY "$GROQ_API_KEY"
          report OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
          report GEMINI_API_KEY "$GEMINI_API_KEY"
          report TOGETHER_API_KEY "$TOGETHER_API_KEY"
          report HF_API_KEY "$HF_API_KEY"
          report FREEBUFF_API_KEY "$FREEBUFF_API_KEY"
          report OPENCODE_API_KEY "$OPENCODE_API_KEY"
          report CUSTOM_1_API_KEY "$CUSTOM_1_API_KEY"
