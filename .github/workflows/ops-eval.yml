name: Golden task eval

# Every week this workflow sends 15 small golden tasks to every configured model (RO3). Each answer is checked by a
# deterministic checker: an exact answer, a regex, a JSON schema, or a unit test for code. No model judges another model.
# The run is held to about 300 calls a week. The scores go to the Worker (POST /ops/eval), to the public mirror
# state/ops/eval.json, and into the capability cache, where a measured score beats an assumed strength.
#
# Two jobs, so the long run never holds the shared state group:
#   1. `eval` has the provider keys. It runs the tasks and uploads a small file of scores. It cannot write to the repo.
#   2. `publish` has no provider key. It reads the scores, writes the files under state/, and commits them.
on:
  schedule:
    - cron: "41 9 * * 0" # every Sunday, 09:41 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 22 has the permission model (--permission). The code tasks run model code in a child process under it.
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Mask the tokens
        env:
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
        run: |
          if [ -n "$OPS_TOKEN" ]; then echo "::add-mask::$OPS_TOKEN"; fi

      - name: Run the golden tasks
        env:
          TITAN_WORKER_URL: ${{ vars.TITAN_WORKER_URL }}
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
          # BEGIN provider secrets (generated from config/providers.catalog.json, run npm run sync:providers)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          TOGETHER_MODEL: ${{ secrets.TOGETHER_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          HF_MODEL: ${{ secrets.HF_MODEL }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_BASE_URL: ${{ secrets.OPENCODE_BASE_URL }}
          OPENCODE_MODEL: ${{ secrets.OPENCODE_MODEL }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_BASE_URL: ${{ secrets.OMNIROUTE_BASE_URL }}
          OMNIROUTE_MODEL: ${{ secrets.OMNIROUTE_MODEL }}
          HERMES_1_API_KEY: ${{ secrets.HERMES_1_API_KEY }}
          HERMES_1_BASE_URL: ${{ secrets.HERMES_1_BASE_URL }}
          HERMES_1_MODEL: ${{ secrets.HERMES_1_MODEL }}
          HERMES_1_CHAT_PATH: ${{ secrets.HERMES_1_CHAT_PATH }}
          HERMES_1_SPECIALIZATION: ${{ secrets.HERMES_1_SPECIALIZATION }}
          HERMES_2_API_KEY: ${{ secrets.HERMES_2_API_KEY }}
          HERMES_2_BASE_URL: ${{ secrets.HERMES_2_BASE_URL }}
          HERMES_2_MODEL: ${{ secrets.HERMES_2_MODEL }}
          HERMES_2_CHAT_PATH: ${{ secrets.HERMES_2_CHAT_PATH }}
          HERMES_2_SPECIALIZATION: ${{ secrets.HERMES_2_SPECIALIZATION }}
          HERMES_3_API_KEY: ${{ secrets.HERMES_3_API_KEY }}
          HERMES_3_BASE_URL: ${{ secrets.HERMES_3_BASE_URL }}
          HERMES_3_MODEL: ${{ secrets.HERMES_3_MODEL }}
          HERMES_3_CHAT_PATH: ${{ secrets.HERMES_3_CHAT_PATH }}
          HERMES_3_SPECIALIZATION: ${{ secrets.HERMES_3_SPECIALIZATION }}
          FREEBUFF_API_KEY: ${{ secrets.FREEBUFF_API_KEY }}
          CUSTOM_1_API_KEY: ${{ secrets.CUSTOM_1_API_KEY }}
          CUSTOM_1_BASE_URL: ${{ secrets.CUSTOM_1_BASE_URL }}
          CUSTOM_1_MODEL: ${{ secrets.CUSTOM_1_MODEL }}
          CUSTOM_1_LABEL: ${{ secrets.CUSTOM_1_LABEL }}
          CUSTOM_2_API_KEY: ${{ secrets.CUSTOM_2_API_KEY }}
          CUSTOM_2_BASE_URL: ${{ secrets.CUSTOM_2_BASE_URL }}
          CUSTOM_2_MODEL: ${{ secrets.CUSTOM_2_MODEL }}
          CUSTOM_2_LABEL: ${{ secrets.CUSTOM_2_LABEL }}
          CUSTOM_3_API_KEY: ${{ secrets.CUSTOM_3_API_KEY }}
          CUSTOM_3_BASE_URL: ${{ secrets.CUSTOM_3_BASE_URL }}
          CUSTOM_3_MODEL: ${{ secrets.CUSTOM_3_MODEL }}
          CUSTOM_3_LABEL: ${{ secrets.CUSTOM_3_LABEL }}
          # END provider secrets
        run: node scripts/ops-eval.mjs run --out "$RUNNER_TEMP/eval-results.json"

      - name: Upload the scores
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-results
          path: ${{ runner.temp }}/eval-results.json
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: eval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit state/ops/eval.json and state/agents.json
    # The shared group of every workflow that commits to state/ (RT2).
    concurrency:
      group: titan-state
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Download the scores
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eval-results
          path: ${{ runner.temp }}/eval

      - name: Mask the tokens
        env:
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
        run: |
          if [ -n "$OPS_TOKEN" ]; then echo "::add-mask::$OPS_TOKEN"; fi

      - name: Write the mirror, feed the capability cache, and post the scores
        env:
          TITAN_WORKER_URL: ${{ vars.TITAN_WORKER_URL }}
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
        run: node scripts/ops-eval.mjs apply --in "$RUNNER_TEMP/eval/eval-results.json"

      - name: Scan the state for secrets
        run: node scripts/check-secrets-in-state.mjs

      - name: Commit and push
        run: |
          node scripts/publish-state.mjs --message "chore(ops): golden task eval $(date -u +%Y-%m-%d)"
