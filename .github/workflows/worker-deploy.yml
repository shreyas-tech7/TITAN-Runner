name: Deploy Worker

# Closes the gap that let a previous worker/src/index.js fix sit unused in
# the repo: nothing deployed it, because titan-runner-brain's only deploy
# path was `npm run deploy` (wrangler deploy) in worker/, run manually by a
# human with Cloudflare credentials (see docs/RUNTIME.md's "Not deployed as
# part of this build" note). This automates it on every change to worker/,
# using the exact wrangler version already pinned in worker/package.json's
# devDependencies rather than pulling in a third-party wrangler-action.
#
# Same "degrade honestly, never hard-fail on a missing opt-in secret"
# pattern as spawn-subagent.yml's OmniRoute step: until CLOUDFLARE_API_TOKEN
# and CLOUDFLARE_ACCOUNT_ID are added as repo secrets (see docs/RUNTIME.md's
# runbook), this workflow no-ops with a warning instead of failing CI.
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/worker-deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check whether Cloudflare credentials are configured
        id: check
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: "20"

      - name: Install dependencies
        if: steps.check.outputs.configured == 'true'
        working-directory: worker
        run: npm ci --no-audit --no-fund

      - name: wrangler deploy
        if: steps.check.outputs.configured == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Not configured yet
        if: steps.check.outputs.configured != 'true'
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID repo secrets aren't set yet, so this push wasn't deployed to titan-runner-brain. See docs/RUNTIME.md's Cloudflare Worker runbook for the one-time setup." >&2
