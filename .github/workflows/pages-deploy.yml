name: Deploy dashboard to Pages

# Deliberately its OWN workflow, separate from titan-pulse.yml, so a
# dashboard rebuild is never on the critical path of a pulse (task brief,
# section C) — even though Actions minutes are free and unlimited on this
# public repo either way (see docs/RUNTIME.md), keeping them separate keeps
# a slow `next build` from ever delaying task dispatch.
#
# Triggers: a push to main that actually touches the dashboard source, a
# manual run, and a daily safety-net rebuild in case the client-side
# raw.githubusercontent.com polling (lib/usePolledJson.ts) is ever
# unavailable for a viewer — the daily rebuild keeps the same-origin
# build-time snapshot from going too stale. It is deliberately NOT triggered
# on every pulse's state/ commit (which would mean a rebuild every ~15
# minutes) — the dashboard's own runtime polling is what stays current
# between builds.
on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/pages-deploy.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm install --no-audit --no-fund

      - name: Build static export
        working-directory: dashboard
        env:
          GITHUB_PAGES_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_GITHUB_OWNER: ${{ github.repository_owner }}
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.event.repository.name }}
          # The titan-runner-brain Worker's URL, e.g.
          # https://titan-runner-brain.<subdomain>.workers.dev — not
          # sensitive on its own (the admin token is what actually gates
          # it), so this is a repo VARIABLE, not a secret. Empty until
          # Shreyas deploys the Worker and sets it (Settings -> Secrets and
          # variables -> Actions -> Variables) — the dashboard degrades
          # honestly with a "not configured yet" panel until then, same as
          # every other optional-integration pattern in this repo.
          NEXT_PUBLIC_TITAN_WORKER_URL: ${{ vars.TITAN_WORKER_URL }}
          # The TITAN-GEV Hugging Face Space URL for the God's Eye View tab, for
          # example https://cozmik7-titan-gev.hf.space. Not sensitive, so it is a
          # repo VARIABLE named GEV_URL. Empty until the Space exists. The tab
          # shows a clear "not connected" state until then. See
          # docs/GODS-EYE-VIEW.md.
          NEXT_PUBLIC_GEV_URL: ${{ vars.GEV_URL }}
        run: npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dashboard/out

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
