name: Deploy dashboard to Pages

# Deliberately its OWN workflow, separate from titan-pulse.yml, so a
# dashboard rebuild is never on the critical path of a pulse (task brief,
# section C) — even though Actions minutes are free and unlimited on this
# public repo either way (see docs/RUNTIME.md), keeping them separate keeps
# a slow `next build` from ever delaying task dispatch.
#
# Triggers: a push to main that actually touches the dashboard source, a
# manual run, and a daily safety-net rebuild in case the client-side
# raw.githubusercontent.com polling (lib/usePolledJson.ts) is ever
# unavailable for a viewer — the daily rebuild keeps the same-origin
# build-time snapshot from going too stale. It is deliberately NOT triggered
# on every pulse's state/ commit (which would mean a rebuild every ~15
# minutes) — the dashboard's own runtime polling is what stays current
# between builds.
on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/pages-deploy.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

# Least privilege at job level (task brief, Track A #4): only the `deploy`
# job needs `pages`/`id-token`; `build` only ever reads the checkout and
# never pushes or deploys anything itself.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm install --no-audit --no-fund

      - name: Build static export
        working-directory: dashboard
        env:
          GITHUB_PAGES_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_GITHUB_OWNER: ${{ github.repository_owner }}
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dashboard/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
