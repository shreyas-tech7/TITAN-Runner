name: Deploy dashboard to Pages

# Deliberately its OWN workflow, separate from titan-pulse.yml, so a
# dashboard rebuild is never on the critical path of a pulse (task brief,
# section C) — even though Actions minutes are free and unlimited on this
# public repo either way (see docs/RUNTIME.md), keeping them separate keeps
# a slow `next build` from ever delaying task dispatch.
#
# Triggers: a push to main that actually touches the dashboard source, a
# manual run, and a daily safety-net rebuild in case the client-side
# raw.githubusercontent.com polling (lib/usePolledJson.ts) is ever
# unavailable for a viewer — the daily rebuild keeps the same-origin
# build-time snapshot from going too stale. It is deliberately NOT triggered
# on every pulse's state/ commit (which would mean a rebuild every ~15
# minutes) — the dashboard's own runtime polling is what stays current
# between builds.
on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/pages-deploy.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm install --no-audit --no-fund

      - name: Build static export
        working-directory: dashboard
        env:
          GITHUB_PAGES_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_GITHUB_OWNER: ${{ github.repository_owner }}
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
