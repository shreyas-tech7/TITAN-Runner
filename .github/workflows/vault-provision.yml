name: Provision vault key

# Gives the Worker its vault key CONNECTOR_KEK without a person seeing it (Wave 12, C2, decision W12-D3).
#
# The key is 32 random bytes made inside this runner. It goes into the Worker secret store over stdin with
# `wrangler secret put`. It is never echoed, never put in an argument, and never written to the job summary.
#
# worker-deploy.yml makes the key on its own when it is missing. Run this workflow by hand when that step could not
# (for example when `wrangler secret list` failed), or to replace the key.
#
# The workflow refuses to replace a current key unless the input rotate is "yes".
# Warning: a new key cannot open the records that the old key sealed. After a rotation, reconnect your tools and
# save your chat keys again.
on:
  workflow_dispatch:
    inputs:
      rotate:
        description: 'Type "yes" to replace a key that already exists. Records sealed with the old key become unreadable.'
        required: false
        default: "no"

permissions:
  contents: read

# Shares worker-deploy's group so a deploy and a secret change never overlap.
concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check whether Cloudflare credentials are configured
        id: check
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID repo secrets are not set, so no vault key was made."
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: "22"

      - name: Install dependencies
        if: steps.check.outputs.configured == 'true'
        working-directory: worker
        run: npm ci --no-audit --no-fund

      - name: Make the vault key
        if: steps.check.outputs.configured == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROTATE: ${{ inputs.rotate }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          names="$(npx wrangler secret list --format json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);console.log(l.map(e=>e.name).join(" "))})')"
          have=no
          case " $names " in *" CONNECTOR_KEK "*) have=yes ;; esac
          if [ "$have" = "yes" ] && [ "${ROTATE:-no}" != "yes" ]; then
            echo "CONNECTOR_KEK exists, so nothing changed. Run again with rotate set to yes to replace it."
            echo "### Vault key" >> "$GITHUB_STEP_SUMMARY"
            echo "The Worker already has CONNECTOR_KEK. Nothing changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          keyfile="$(mktemp "${RUNNER_TEMP:-/tmp}/kek.XXXXXX")"
          trap 'rm -f "$keyfile"' EXIT
          node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))' > "$keyfile"
          echo "::add-mask::$(cat "$keyfile")"
          npx wrangler secret put CONNECTOR_KEK < "$keyfile" > /dev/null
          {
            echo "### Vault key"
            if [ "$have" = "yes" ]; then echo "Replaced. Records sealed with the old key are unreadable. Reconnect your tools."; else echo "Made. The vault is ready."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "CONNECTOR_KEK was set."

      - name: Not configured yet
        if: steps.check.outputs.configured != 'true'
        run: echo "Skipped. Add the Cloudflare repo secrets, then run this workflow again."
